version: '3.8'

services:
  gophish:
    build:
      context: .
      dockerfile: Dockerfile.updated
    container_name: gophish
    hostname: gophish
    restart: unless-stopped
    ports:
      # Admin interface
      - "3333:3333"
      # Phish server
      - "8080:8080"
      # Phish server HTTPS
      - "8443:8443"
      # Phish server HTTP (if needed)
      - "80:80"
    environment:
      # Admin server configuration
      - ADMIN_LISTEN_URL=0.0.0.0:3333
      - ADMIN_USE_TLS=false
      # - ADMIN_CERT_PATH=gophish_admin.crt
      # - ADMIN_KEY_PATH=gophish_admin.key
      
      # Phish server configuration
      - PHISH_LISTEN_URL=0.0.0.0:8080
      - PHISH_USE_TLS=false
      # - PHISH_CERT_PATH=example.crt
      # - PHISH_KEY_PATH=example.key
      
      # Database configuration (SQLite by default)
      - DB_NAME=sqlite3
      - DB_FILE_PATH=gophish.db
      
      # For MySQL:
      # - DB_NAME=mysql
      # - DB_FILE_PATH=username:password@tcp(mysql:3306)/gophish?charset=utf8&parseTime=True&loc=Local
      
      # For PostgreSQL:
      # - DB_NAME=postgres
      # - DB_FILE_PATH=host=postgres port=5432 user=gophish password=gophish dbname=gophish sslmode=disable
      
      # Contact address for transparency reports
      - CONTACT_ADDRESS=
    volumes:
      # Persist the SQLite database
      - gophish_data:/opt/gophish
      # Mount custom config if needed
      # - ./config.json:/opt/gophish/config.json:ro
      # Mount SSL certificates if using TLS
      # - ./certs:/opt/gophish/certs:ro
    networks:
      - gophish_net

  # Optional: MySQL database
  # mysql:
  #   image: mysql:8.0
  #   container_name: gophish_mysql
  #   restart: unless-stopped
  #   environment:
  #     - MYSQL_ROOT_PASSWORD=root_password
  #     - MYSQL_DATABASE=gophish
  #     - MYSQL_USER=gophish
  #     - MYSQL_PASSWORD=gophish_password
  #   volumes:
  #     - mysql_data:/var/lib/mysql
  #   networks:
  #     - gophish_net

  # Optional: PostgreSQL database
  # postgres:
  #   image: postgres:15
  #   container_name: gophish_postgres
  #   restart: unless-stopped
  #   environment:
  #     - POSTGRES_DB=gophish
  #     - POSTGRES_USER=gophish
  #     - POSTGRES_PASSWORD=gophish_password
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   networks:
  #     - gophish_net

volumes:
  gophish_data:
  # mysql_data:
  # postgres_data:

networks:
  gophish_net:
    driver: bridge