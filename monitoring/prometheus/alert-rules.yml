# Prometheus Alert Rules for Gophish HERA V3
# Add these rules to your prometheus.yml:
#
# rule_files:
#   - "alert-rules.yml"
#
# alerting:
#   alertmanagers:
#     - static_configs:
#       - targets: ['localhost:9093']  # Alertmanager address

groups:
  - name: gophish_security_critical
    interval: 30s
    rules:
      - alert: TemplateGoroutineLeak
        expr: gophish_template_goroutines > 100
        for: 10m
        labels:
          severity: critical
          component: template
        annotations:
          summary: "Template goroutine leak detected"
          description: "{{ $value }} template goroutines are active (threshold: 100). This indicates a potential goroutine leak from template execution timeouts."
          runbook: "Check template execution logs for timeouts. Consider restarting the application if count continues to grow."

      - alert: SystemGoroutineLeakCritical
        expr: gophish_goroutines > 10000
        for: 10m
        labels:
          severity: critical
          component: system
        annotations:
          summary: "Critical system goroutine count"
          description: "{{ $value }} total goroutines detected (threshold: 10000). System is likely experiencing a goroutine leak."
          runbook: "Immediate investigation required. Generate pprof goroutine profile and restart application."

      - alert: MemoryExhaustion
        expr: gophish_memory_mb > 2048
        for: 10m
        labels:
          severity: critical
          component: system
        annotations:
          summary: "Critical memory usage"
          description: "Memory usage is {{ $value }} MB (threshold: 2048 MB). Risk of OOM."
          runbook: "Generate heap profile, investigate memory leaks. Check CORS cache size and template rate limiter count."

  - name: gophish_security_high
    interval: 1m
    rules:
      - alert: HighCORSRejectionRate
        expr: rate(gophish_cors_requests_total{allowed="false"}[5m]) > 10
        for: 5m
        labels:
          severity: warning
          component: cors
        annotations:
          summary: "High CORS rejection rate"
          description: "CORS is rejecting {{ $value }} requests/sec (threshold: 10/sec). Possible attack or misconfiguration."
          runbook: "Check logs for rejected origins. Verify CORS configuration. Investigate source IPs."

      - alert: HighTemplateTimeoutRate
        expr: rate(gophish_template_timeouts_total[5m]) > 1
        for: 5m
        labels:
          severity: warning
          component: template
        annotations:
          summary: "High template timeout rate"
          description: "{{ $value }} template timeouts/sec (threshold: 1/sec). Templates may be too complex or system is overloaded."
          runbook: "Review recent templates for complexity. Check system load. Consider increasing timeout or adding rate limits."

      - alert: HighSessionValidationErrors
        expr: rate(gophish_session_validation_errors_total[5m]) > 5
        for: 5m
        labels:
          severity: warning
          component: session
        annotations:
          summary: "High session validation error rate"
          description: "{{ $value }} session validation errors/sec (threshold: 5/sec). Possible attack or session corruption."
          runbook: "Check session store initialization. Verify session keys are correct. Review authentication logs."

      - alert: SystemGoroutineLeakWarning
        expr: gophish_goroutines > 5000
        for: 10m
        labels:
          severity: warning
          component: system
        annotations:
          summary: "High system goroutine count"
          description: "{{ $value }} total goroutines (threshold: 5000). Potential goroutine leak."
          runbook: "Monitor goroutine count trend. Check template goroutines specifically. Prepare to restart if continues growing."

      - alert: HighMemoryUsage
        expr: gophish_memory_mb > 1024
        for: 10m
        labels:
          severity: warning
          component: system
        annotations:
          summary: "High memory usage"
          description: "Memory usage is {{ $value }} MB (threshold: 1024 MB)."
          runbook: "Monitor memory trends. Check for memory leaks in CORS cache or template rate limiters."

  - name: gophish_security_medium
    interval: 5m
    rules:
      - alert: TemplateErrorRateIncreased
        expr: rate(gophish_template_errors_total[15m]) > 0.1
        for: 15m
        labels:
          severity: info
          component: template
        annotations:
          summary: "Template error rate increased"
          description: "{{ $value }} template errors/sec over 15 minutes. Check template validation."
          runbook: "Review template execution logs. Identify problematic templates."

      - alert: WeakPasswordAttempts
        expr: rate(gophish_weak_passwords_rejected_total[15m]) > 0.5
        for: 15m
        labels:
          severity: info
          component: password
        annotations:
          summary: "High weak password rejection rate"
          description: "{{ $value }} weak passwords rejected/sec. Users attempting weak passwords."
          runbook: "Normal behavior. Consider user education if rate is abnormally high."

  - name: gophish_availability
    interval: 1m
    rules:
      - alert: GophishDown
        expr: up{job="gophish"} == 0
        for: 2m
        labels:
          severity: critical
          component: system
        annotations:
          summary: "Gophish application is down"
          description: "Gophish has been down for more than 2 minutes."
          runbook: "Check application status, logs, and system resources. Restart if necessary."

      - alert: HighErrorRate
        expr: rate(gophish_template_errors_total[5m]) / rate(gophish_template_executions_total[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
          component: template
        annotations:
          summary: "High template error rate (>10%)"
          description: "{{ $value | humanizePercentage }} of template executions are failing."
          runbook: "Investigate template errors. Check for invalid template syntax or data issues."

  - name: gophish_performance
    interval: 5m
    rules:
      - alert: TemplateExecutionSlowdown
        expr: increase(gophish_template_timeouts_total[1h]) > 100
        for: 1h
        labels:
          severity: warning
          component: performance
        annotations:
          summary: "Many template execution timeouts"
          description: "{{ $value }} template timeouts in the last hour. System may be overloaded."
          runbook: "Check system resources (CPU, memory, I/O). Review template complexity."

  - name: gophish_security_anomalies
    interval: 15m
    rules:
      - alert: UnusualCORSRejectionSpike
        expr: |
          (
            rate(gophish_cors_requests_total{allowed="false"}[5m])
            /
            rate(gophish_cors_requests_total[5m])
          ) > 0.5
        for: 10m
        labels:
          severity: warning
          component: cors
        annotations:
          summary: "More than 50% of CORS requests being rejected"
          description: "{{ $value | humanizePercentage }} of CORS requests are being rejected. Possible attack or misconfiguration."
          runbook: "Investigate source of rejected requests. Check if attack pattern. Verify CORS configuration."

      - alert: SessionStoreNotInitialized
        expr: up{job="gophish"} == 1 and absent(gophish_session_validation_errors_total)
        for: 5m
        labels:
          severity: warning
          component: session
        annotations:
          summary: "Session metrics not available"
          description: "Session validation metrics are not being exported. Session store may not be initialized."
          runbook: "Check application startup logs for session initialization errors."

